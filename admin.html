<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English-App — Admin Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f0f0;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: #6a5e6d;
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header .actions { display: flex; gap: 8px; align-items: center; }
    #syncStatus {
      font-size: 0.8rem;
      opacity: 0.85;
      min-width: 80px;
      text-align: right;
    }
    #syncStatus[data-state="saving"] { color: #ffd580; }
    #syncStatus[data-state="saved"]  { color: #a8e6a3; }
    #syncStatus[data-state="error"]  { color: #ffaaaa; }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-export  { background: #d8a29e; color: #fff; }
    .btn-import  { background: #ddc3b2; color: #6a5e6d; }
    .btn-add-cat { background: #fff; color: #6a5e6d; }
    .btn-primary { background: #6a5e6d; color: #fff; }
    .btn-danger  { background: #e07070; color: #fff; padding: 4px 10px; font-size: 0.78rem; }
    .btn-small   { padding: 5px 12px; font-size: 0.8rem; }

    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      height: calc(100vh - 61px);
    }

    /* Sidebar */
    .sidebar {
      background: #fff;
      border-right: 1px solid #e8dede;
      overflow-y: auto;
      padding: 12px 0;
    }
    .sidebar-item {
      padding: 10px 18px;
      cursor: pointer;
      border-left: 3px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      text-transform: capitalize;
      transition: background 0.1s;
    }
    .sidebar-item:hover { background: #fff2f3; }
    .sidebar-item.active { border-left-color: #d8a29e; background: #fff2f3; font-weight: 600; }
    .sidebar-item .badge {
      font-size: 0.72rem;
      background: #e8dede;
      color: #6a5e6d;
      border-radius: 10px;
      padding: 2px 7px;
    }
    .sidebar-item .lock-icon { font-size: 0.75rem; color: #aaa; margin-left: 4px; }

    /* Main */
    .main {
      overflow-y: auto;
      padding: 24px;
    }

    .cat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .cat-header h2 { font-size: 1.3rem; text-transform: capitalize; color: #6a5e6d; }
    .cat-header .lock-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #888;
      cursor: pointer;
      user-select: none;
    }
    .cat-header .lock-toggle input { cursor: pointer; }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      border-bottom: 2px solid #e8dede;
    }
    .tab {
      padding: 8px 18px;
      cursor: pointer;
      font-size: 0.88rem;
      color: #888;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s;
    }
    .tab.active { color: #6a5e6d; border-bottom-color: #d8a29e; font-weight: 600; }

    .question-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .question-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 8px 12px;
    }
    .question-item .q-text {
      flex: 1;
      font-size: 0.88rem;
      outline: none;
      border: none;
      background: transparent;
      cursor: text;
    }
    .question-item .q-text:focus { color: #6a5e6d; }
    .q-num {
      font-size: 0.75rem;
      color: #bbb;
      min-width: 22px;
      text-align: right;
    }

    .add-question-form {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }
    .add-question-form input {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.88rem;
      outline: none;
    }
    .add-question-form input:focus { border-color: #d8a29e; }

    /* Add category modal */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 14px;
      padding: 28px;
      width: 380px;
      max-width: 95vw;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal h3 { font-size: 1.1rem; color: #6a5e6d; }
    .modal input {
      padding: 9px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }
    .modal input:focus { border-color: #d8a29e; }
    .modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    .toast {
      position: fixed;
      bottom: 24px; right: 24px;
      background: #6a5e6d;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 200;
    }
    .toast.show { opacity: 1; }

    .empty { color: #aaa; font-size: 0.88rem; padding: 12px 0; }

    /* Import file input hidden */
    #importInput { display: none; }
  </style>
</head>
<body>

<header>
  <h1>English-App — Admin Panel</h1>
  <div class="actions">
    <span id="syncStatus" data-state="loading">⏳ Loading…</span>
    <button class="btn btn-add-cat" onclick="openAddCat()">+ Category</button>
    <label class="btn btn-import" title="Load a questions.json file">
      Import JSON
      <input type="file" id="importInput" accept=".json" onchange="importJSON(event)" />
    </label>
    <button class="btn btn-export" onclick="exportJSON()">Export JSON</button>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"><p class="empty" style="padding:40px">Loading…</p></main>
</div>

<!-- Add Category modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>New Category</h3>
    <input id="newCatName" placeholder="Category name (e.g. travel)" />
    <div class="modal-actions">
      <button class="btn" onclick="closeAddCat()">Cancel</button>
      <button class="btn btn-primary" onclick="addCategory()">Add</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const BIN_ID     = '69db685c36566621a8a4bb11';
const MASTER_KEY = '$2a$10$.d0ypT0xBbf/81rM3Zt.DOMqOlCKyFH69/9d6BqOyOK5Yg7us8a6q';
const BIN_URL    = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

// ── State ─────────────────────────────────────────────────────────────────────
let data = [];        // [{name, lock, titles, questions:[[], []]}]
let activeCat = 0;
let activeLevel = 0;
let saveTimer = null;

// ── Persistence ───────────────────────────────────────────────────────────────
function save() {
  // Debounce: wait 600ms after last change before pushing
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushToBin, 600);
}

async function pushToBin() {
  setSyncStatus('saving');
  try {
    const res = await fetch(BIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': MASTER_KEY,
      },
      body: JSON.stringify(data),
    });
    if (!res.ok) throw new Error(res.status);
    setSyncStatus('saved');
  } catch (e) {
    setSyncStatus('error');
    toast('Save failed — check connection');
  }
}

async function load() {
  setSyncStatus('loading');
  try {
    const res = await fetch(`${BIN_URL}/latest`, {
      headers: { 'X-Master-Key': MASTER_KEY }
    });
    if (!res.ok) throw new Error(res.status);
    const json = await res.json();
    data = json.record;
    setSyncStatus('saved');
    render();
  } catch (e) {
    setSyncStatus('error');
    toast('Failed to load from JSONBin');
    data = [];
    render();
  }
}

function setSyncStatus(state) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const map = {
    loading: ['⏳', 'Loading…'],
    saving:  ['⏫', 'Saving…'],
    saved:   ['✅', 'Saved'],
    error:   ['❌', 'Error'],
  };
  const [icon, label] = map[state] || ['', ''];
  el.textContent = icon + ' ' + label;
  el.dataset.state = state;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  renderSidebar();
  renderMain();
}

function renderSidebar() {
  const el = document.getElementById('sidebar');
  el.innerHTML = data.map((cat, i) => `
    <div class="sidebar-item ${i === activeCat ? 'active' : ''}" onclick="selectCat(${i})">
      <span>${cat.name || '<unnamed>'} ${cat.lock ? '<span class="lock-icon">🔒</span>' : ''}</span>
      <span class="badge">${totalQ(cat)}</span>
    </div>
  `).join('') + (data.length === 0 ? '<p class="empty" style="padding:16px">No categories</p>' : '');
}

function renderMain() {
  const el = document.getElementById('main');
  if (data.length === 0) {
    el.innerHTML = '<p class="empty" style="padding:40px">No categories yet. Click "+ Category" to start.</p>';
    return;
  }

  const cat = data[activeCat];
  if (!cat) return;

  const titles = cat.titles || ['A1 / A2', 'B1 / B2'];
  const questions = cat.questions || [[], []];

  el.innerHTML = `
    <div class="cat-header">
      <h2>${cat.name || 'Unnamed'}</h2>
      <div style="display:flex;gap:12px;align-items:center">
        <label class="lock-toggle">
          <input type="checkbox" ${cat.lock ? 'checked' : ''} onchange="toggleLock(${activeCat})" />
          Locked
        </label>
        <button class="btn btn-danger btn-small" onclick="deleteCategory(${activeCat})">Delete category</button>
      </div>
    </div>

    <div class="tabs">
      ${titles.map((t, i) => `
        <div class="tab ${i === activeLevel ? 'active' : ''}" onclick="selectLevel(${i})">${t}</div>
      `).join('')}
    </div>

    <ul class="question-list" id="questionList">
      ${(questions[activeLevel] || []).map((q, qi) => `
        <li class="question-item">
          <span class="q-num">${qi + 1}.</span>
          <input class="q-text" value="${escHtml(q)}"
            onblur="editQuestion(${activeCat}, ${activeLevel}, ${qi}, this.value)"
            onkeydown="if(event.key==='Enter'){this.blur()}" />
          <button class="btn btn-danger" onclick="deleteQuestion(${activeCat}, ${activeLevel}, ${qi})">✕</button>
        </li>
      `).join('')}
    </ul>
    ${(questions[activeLevel] || []).length === 0 ? '<p class="empty">No questions yet.</p>' : ''}

    <form class="add-question-form" onsubmit="addQuestion(event, ${activeCat}, ${activeLevel})">
      <input id="newQ" placeholder="Type a new question and press Enter…" autocomplete="off" />
      <button class="btn btn-primary btn-small" type="submit">Add</button>
    </form>
  `;
}

function totalQ(cat) {
  if (!cat.questions) return 0;
  return cat.questions.reduce((s, arr) => s + arr.length, 0);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Actions ───────────────────────────────────────────────────────────────────
function selectCat(i) {
  activeCat = i;
  activeLevel = 0;
  render();
}

function selectLevel(i) {
  activeLevel = i;
  renderMain();
}

function toggleLock(i) {
  data[i].lock = !data[i].lock;
  save();
  renderSidebar();
}

function deleteCategory(i) {
  if (!confirm(`Delete category "${data[i].name}"?`)) return;
  data.splice(i, 1);
  activeCat = Math.min(activeCat, data.length - 1);
  save();
  render();
}

function addQuestion(event, catIdx, levelIdx) {
  event.preventDefault();
  const input = document.getElementById('newQ');
  const q = input.value.trim();
  if (!q) return;
  if (!data[catIdx].questions[levelIdx]) data[catIdx].questions[levelIdx] = [];
  data[catIdx].questions[levelIdx].push(q);
  save();
  input.value = '';
  renderMain();
  renderSidebar();
  // scroll list to bottom
  const list = document.getElementById('questionList');
  if (list) list.lastElementChild?.scrollIntoView({ behavior: 'smooth' });
  toast('Question added');
}

function editQuestion(catIdx, levelIdx, qIdx, value) {
  const v = value.trim();
  if (!v) { deleteQuestion(catIdx, levelIdx, qIdx); return; }
  data[catIdx].questions[levelIdx][qIdx] = v;
  save();
  renderSidebar();
}

function deleteQuestion(catIdx, levelIdx, qIdx) {
  data[catIdx].questions[levelIdx].splice(qIdx, 1);
  save();
  renderMain();
  renderSidebar();
}

// ── Add category ──────────────────────────────────────────────────────────────
function openAddCat() {
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('newCatName').focus(), 50);
}
function closeAddCat() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('newCatName').value = '';
}
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeAddCat();
});
document.getElementById('newCatName').addEventListener('keydown', e => {
  if (e.key === 'Enter') addCategory();
  if (e.key === 'Escape') closeAddCat();
});

function addCategory() {
  const name = document.getElementById('newCatName').value.trim().toLowerCase();
  if (!name) return;
  if (data.find(c => c.name === name)) { alert('Category already exists'); return; }
  data.push({ name, lock: false, titles: ['A1 / A2', 'B1 / B2'], questions: [[], []] });
  save();
  activeCat = data.length - 1;
  activeLevel = 0;
  closeAddCat();
  render();
  toast('Category added');
}

// ── Export / Import ───────────────────────────────────────────────────────────
function exportJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'questions.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('questions.json downloaded');
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if (!Array.isArray(parsed)) throw new Error('Expected array');
      data = parsed;
      activeCat = 0; activeLevel = 0;
      save();
      render();
      toast('Imported ' + data.length + ' categories');
    } catch(err) {
      alert('Invalid JSON: ' + err.message);
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
load();
</script>
</body>
</html>
